apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
   name: cache-app-v3
   namespace: argocd

spec:
    project: default

    source:
      repoURL: https://github.com/ZytaWisz/cache.git
      targetRevision: HEAD
      path: k8s-v3

      helm:
        releaseName: cache-app-v3
        valueFiles:
          - values.yaml

    destination:
      server: https://kubernetes.default.svc
      namespace: cache-app-v3

    syncPolicy:
      automated:
        prune: true
        selfHeal: true

      syncOptions:
        - ApplyOutOfSyncOnly=true
        - PrunePropagationPolicy=foreground
