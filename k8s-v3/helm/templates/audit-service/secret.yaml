  apiVersion: v1
  kind: Secret

  metadata:
    name: customer-audit-service-secret
    namespace: {{ .Values.namespace }}

    annotations:
      argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.auditServiceSecret }}"

  type: Opaque

  stringData:
    DB_USERNAME: {{ .Values.postgres.username | quote }}
    DB_PASSWORD: {{ .Values.postgres.password | quote }}
