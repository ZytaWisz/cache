apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.kafkaUi.name }}
  namespace: {{ .Values.namespace }}

  annotations:
    argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.kafkaUi }}"

spec:
  replicas: {{ .Values.kafkaUi.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.kafkaUi.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.kafkaUi.name }}

    spec:
      containers:
        - name: kafka-ui

          image: {{ .Values.kafkaUi.image }}

          ports:
            - containerPort: {{ .Values.kafkaUi.service.targetPort }}

          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.kafkaUi.clusterName | quote }}

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.kafkaUi.service.targetPort }}

            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.kafkaUi.service.targetPort }}

            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.kafkaUi.name }}
  namespace: {{ .Values.namespace }}

spec:
  type: {{ .Values.kafkaUi.service.type }}

  selector:
    app: {{ .Values.kafkaUi.name }}

  ports:
    - port: {{ .Values.kafkaUi.service.port }}
      targetPort: {{ .Values.kafkaUi.service.targetPort }}
      nodePort: {{ .Values.kafkaUi.service.nodePort }}