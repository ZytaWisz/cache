  apiVersion: batch/v1
  kind: Job

  metadata:
    name: mysql-grant-debezium
    namespace: {{ .Values.namespace }}

    annotations:
      argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.mysqlGrant }}"

  spec:
    backoffLimit: 3

    template:
      spec:
        restartPolicy: Never

        containers:
          - name: mysql-grant

            image: mysql:8.0

            command:
              - /bin/sh
              - -c
              - |
                set -e
                
                echo "Waiting for MySQL..."
                
                until mysqladmin ping \
                  -h {{ .Values.mysql.hostname }} \
                  -uroot \
                  -p${MYSQL_ROOT_PASSWORD} \
                  --silent; do
                  sleep 5
                done
                
                echo "MySQL is ready. Granting privileges..."
                
                mysql \
                  -h {{ .Values.mysql.hostname }} \
                  -uroot \
                  -p${MYSQL_ROOT_PASSWORD} <<EOF
                
                CREATE USER IF NOT EXISTS '{{ .Values.mysql.username }}'@'%'
                IDENTIFIED BY '{{ .Values.mysql.password }}';
                
                GRANT SELECT,
                       RELOAD,
                       SHOW DATABASES,
                       REPLICATION SLAVE,
                       REPLICATION CLIENT,
                       LOCK TABLES
                ON *.* TO '{{ .Values.mysql.username }}'@'%';
                
                FLUSH PRIVILEGES;
                
                EOF
                
                echo "Done."

            env:
              - name: MYSQL_ROOT_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: customer-service-secret
                    key: DB_ROOT_PASSWORD