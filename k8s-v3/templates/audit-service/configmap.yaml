{{- if .Values.auditService.enabled }}
apiVersion: v1
kind: ConfigMap

metadata:
    name: customer-audit-service-config
    namespace: {{ .Values.namespace }}

    annotations:
        argocd.argoproj.io/sync-wave: "{{ .Values.syncWaves.auditServiceConfigMap }}"

data:
    SPRING_PROFILES_ACTIVE: "{{ .Values.activeProfiles }}"

    DB_URL: "jdbc:postgresql://{{ .Values.postgres.hostname }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"

    SPRING_KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.bootstrapServers }}"
{{- end }}